<style>
/* Layout: a lift-ticket header, then a sticky bar (day tabs + gym/home switch) over a single column of exercise cards. Phases use trail difficulty markers. */
:root {
  --bg: #EDF2F5;
  --surface: #FFFFFF;
  --fg: #0F1B25;
  --muted: #536472;
  --line: #D2DDE4;
  --accent: #D9531E;
  --accent-soft: #FBE6DC;
  --green: #17925A;
  --blue: #1F5FD1;

  --font-display: "Archivo", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1117; --surface: #121D26; --fg: #E5EDF2; --muted: #93A5B3; --line: #223240;
    --accent: #FF7B42; --accent-soft: #3A2117; --green: #3CC486; --blue: #6C9BFF; --diamond: #E5EDF2; --chip: #1A2833;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1117; --surface: #121D26; --fg: #E5EDF2; --muted: #93A5B3; --line: #223240;
  --accent: #FF7B42; --accent-soft: #3A2117; --green: #3CC486; --blue: #6C9BFF; --diamond: #E5EDF2; --chip: #1A2833;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header.hero { padding-block: 28px 20px; }
.ticket {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  display: grid; grid-template-columns: 1fr auto; overflow: hidden;
}
.ticket-main { padding: 20px 20px 18px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--font-display); font-weight: 900; font-stretch: 125%;
  font-size: clamp(30px, 8vw, 44px); line-height: 1.05; margin: 6px 0 10px; text-wrap: balance; letter-spacing: -.01em;
}
.hero p { margin: 0; color: var(--muted); max-width: 52ch; }
.ticket-stub {
  border-left: 2px dashed var(--line); padding: 20px 18px; display: grid; align-content: center; justify-items: center; gap: 2px;
  background: var(--accent); color: #fff; text-align: center;
}
.ticket-stub b { font-family: var(--font-display); font-stretch: 125%; font-weight: 900; font-size: 40px; line-height: 1; }
.ticket-stub span { font-size: 12px; letter-spacing: .08em; }

.schedule { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.schedule span {
  font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--fg);
}
.schedule span b { font-family: var(--font-mono); margin-right: 4px; }

/* Phase selector */
section.phases { padding-block: 4px 18px; }
h2 {
  font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 18px; margin: 0 0 10px;
}
.phase-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.phase-btn {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0;
}
.phase-btn small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.phase-btn strong { font-size: 13px; font-weight: 700; }
.phase-btn[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.phase-btn:focus-visible, .tab:focus-visible, .mode button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mark { width: 18px; height: 18px; display: inline-block; }
.mark.green { border-radius: 50%; background: var(--green); }
.mark.blue { background: var(--blue); border-radius: 2px; }
.mark.black { background: var(--diamond); transform: rotate(45deg) scale(.82); border-radius: 2px; }
.mark.taper { border-radius: 50%; border: 3px solid var(--muted); }
.phase-note {
  margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
.phase-note ul { margin: 0; padding-left: 1.2em; }
.phase-note li + li { margin-top: 2px; }

/* Sticky bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-block: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; }
.tab {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 6px 12px; display: grid; line-height: 1.2; text-align: left;
}
.tab b { font-family: var(--font-display); font-stretch: 125%; font-weight: 900; font-size: 18px; }
.tab small { font-size: 11px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab[aria-selected="true"] small { color: var(--bg); opacity: .75; }
.mode { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.mode button {
  font: inherit; font-size: 13px; font-weight: 700; border: 0; background: transparent; color: var(--muted);
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.mode button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* Day content */
main { padding-block: 18px 40px; }
.day-head { margin-bottom: 14px; }
.day-head h2 { font-size: 24px; margin: 0; font-stretch: 118%; }
.day-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.stack { display: grid; gap: 12px; }

.block {
  border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px;
}
.block h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
.block ol, .block ul { margin: 0; padding-left: 1.3em; }
.block li { font-size: 14px; }
.block li span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 6px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0;
  display: grid; gap: 10px;
}
.card-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.card-title { min-width: 0; }
.idx { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.card h3 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.3; }
.target { font-size: 13px; color: var(--muted); }
.sets {
  flex: none; font-family: var(--font-mono); font-weight: 700; font-size: 13px; white-space: nowrap;
  background: var(--chip); padding: 4px 10px; border-radius: 8px; font-variant-numeric: tabular-nums;
}
.card ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.card ol li::marker { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.cue {
  background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px;
}
.cue b { color: var(--accent); margin-right: 4px; }
.why { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; background: var(--chip); margin-bottom: 4px;
}
.badge .mark { width: 10px; height: 10px; }
.card.locked { opacity: .55; }
.card.locked .lock-msg { font-size: 13px; color: var(--muted); }

footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
footer p { margin: 0 0 6px; max-width: 60ch; }

@media (max-width: 460px) {
  .ticket { grid-template-columns: 1fr; }
  .ticket-stub { border-left: 0; border-top: 2px dashed rgba(255,255,255,.5); grid-auto-flow: column; justify-content: start; gap: 10px; padding: 12px 20px; align-items: baseline; }
  .ticket-stub b { font-size: 30px; }
  .phase-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar .wrap { gap: 8px; }
  .tab { padding: 5px 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: opacity .2s ease; }
}
</style>

const DAYS = [

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let mode = store.get('sb-mode', 'gym');
let dayId = store.get('sb-day', 'A');
let phase = Number(store.get('sb-phase', '1'));
if (!['gym', 'home'].includes(mode)) mode = 'gym';
if (!DAYS.some(d => d.id === dayId)) dayId = 'A';
if (!PHASES.some(p => p.week === phase)) phase = 1;

const pick = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v[mode] : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const phaseOf = w => PHASES.filter(p => p.week <= w).pop();

function renderPhases() {
  const row = document.getElementById('phaseRow');
  row.innerHTML = PHASES.map(p => `
    <button type="button" class="phase-btn" id="phase-${p.week}" data-week="${p.week}" aria-pressed="${p.week === phase}">
      <span class="mark ${p.mark}" aria-hidden="true"></span>
      <strong>${p.name}</strong><small>${p.range}</small>
    </button>`).join('');
  const cur = PHASES.find(p => p.week === phase);
  document.getElementById('phaseNote').innerHTML = `<ul>${cur.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = DAYS.map(d => `
    <button type="button" role="tab" class="tab" id="tab-${d.id}" data-day="${d.id}" aria-selected="${d.id === dayId}">
      <b>${d.id}</b><small>${d.when}</small>
    </button>`).join('');
  document.querySelectorAll('.mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
}

function renderDay() {
  const d = DAYS.find(x => x.id === dayId);
  let n = 0;
  const cards = d.ex.map(e => {
    const locked = phase < 13 && e.from > phase;
    const p = phaseOf(e.from);
    const badge = e.from > 1 ? `<div class="badge"><span class="mark ${p.mark}" aria-hidden="true"></span>第 ${e.from} 週起</div>` : '';
    n++;
    const steps = pick(e.steps);
    const why = e.why ? `<div class="why">${esc(e.why)}</div>` : '';
    return `
      <article class="card${locked ? ' locked' : ''}">
        <div class="card-top">
          <div class="card-title">
            ${badge}
            <div class="idx">${d.id}${String(n).padStart(2, '0')}</div>
            <h3>${esc(pick(e.name))}</h3>
            <div class="target">${esc(e.target)}</div>
          </div>
          <div class="sets">${esc(pick(e.sets))}</div>
        </div>
        ${locked ? `<div class="lock-msg">目前階段還不用做，到第 ${e.from} 週再加進來。</div>` : ''}
        <ol>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
        <div class="cue"><b>重點</b>${esc(pick(e.cue))}</div>
        ${why}
      </article>`;
  }).join('');

  const taper = phase === 13 ? `<div class="block"><h3>出發前 1 週</h3><ul><li>只練一次 A 日，每個動作組數減半。B、C 日改成伸展和散步。</li></ul></div>` : '';

  document.getElementById('day').innerHTML = `
    <div class="day-head">
      <h2>${d.id} 日・${esc(d.title)}</h2>
      <p>${esc(d.sub)}</p>
    </div>
    <div class="stack">
      ${taper}
      <div class="block"><h3>熱身 10 分鐘</h3><ul>${WARMUP.map(([a, b]) => `<li>${esc(a)}<span>${esc(b)}</span></li>`).join('')}</ul></div>
      ${cards}
      <div class="block"><h3>收操伸展</h3><ul>${COOLDOWN.map(([a, b]) => `<li>${esc(a)}<span>${esc(b)}</span></li>`).join('')}</ul></div>
    </div>`;
}

function renderAll() { renderPhases(); renderTabs(); renderDay(); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.day) { dayId = t.dataset.day; store.set('sb-day', dayId); renderTabs(); renderDay(); window.scrollTo({ top: document.querySelector('.bar').offsetTop - 1, behavior: 'auto' }); }
  else if (t.dataset.mode) { mode = t.dataset.mode; store.set('sb-mode', mode); renderTabs(); renderDay(); }
  else if (t.dataset.week) { phase = Number(t.dataset.week); store.set('sb-phase', String(phase)); renderPhases(); renderDay(); }
});

renderAll();
</script>
